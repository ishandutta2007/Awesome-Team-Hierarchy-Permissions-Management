<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .pulse-circle { animation: pulse 4s ease-in-out infinite alternate; }
    .pulse-circle-rev { animation: pulse 5s ease-in-out infinite alternate-reverse; }
    .float-node { animation: float 6s ease-in-out infinite alternate; }
    .float-card { animation: floatCard 7s ease-in-out infinite alternate; }
    .dash-flow { stroke-dasharray: 6 6; animation: dashMove 20s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; letter-spacing: -0.5px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 17px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Behind all content) -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" filter="url(#softGlow)" class="pulse-circle" />
  <circle cx="1050" cy="280" r="160" fill="#ec4899" filter="url(#softGlow)" class="pulse-circle-rev" />
  <circle cx="950" cy="80" r="110" fill="#06b6d4" filter="url(#softGlow)" class="pulse-circle" />

  <!-- Architectural Background Grid -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Subtle Dynamic Hierarchy Graph Elements (Right Side Decorative, Behind Foreground) -->
  <g opacity="0.65" transform="translate(100, 0)">
    <!-- Connecting flow paths -->
    <path d="M 820 100 L 940 100 L 940 170 L 870 170" fill="none" stroke="#6366f1" stroke-width="2" class="dash-flow" />
    <path d="M 940 170 L 1010 170" fill="none" stroke="#06b6d4" stroke-width="2" class="dash-flow" />
    <path d="M 870 200 L 870 250" fill="none" stroke="#a855f7" stroke-width="2" class="dash-flow" />
    <path d="M 1010 200 L 1010 250" fill="none" stroke="#ec4899" stroke-width="2" class="dash-flow" />

    <!-- Organization Root Node -->
    <g class="float-node" style="animation-delay: 0s;">
      <rect x="760" y="80" width="130" height="42" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="780" cy="101" r="6" fill="#6366f1" filter="url(#glow)" />
      <text x="795" y="106" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Enterprise Org</text>
    </g>

    <!-- Role Nodes (Level 2) -->
    <g class="float-node" style="animation-delay: -1.5s;">
      <rect x="800" y="160" width="115" height="38" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="818" cy="179" r="5" fill="#a855f7" />
      <text x="830" y="183" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Security Admin</text>
    </g>

    <g class="float-node" style="animation-delay: -3s;">
      <rect x="945" y="160" width="125" height="38" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="963" cy="179" r="5" fill="#06b6d4" />
      <text x="975" y="183" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Engineering Dept</text>
    </g>

    <!-- Permission Leaf Nodes (Level 3) -->
    <g class="float-node" style="animation-delay: -2s;">
      <rect x="815" y="240" width="95" height="32" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="830" y="260" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a5b4fc">RBAC / ABAC</text>
    </g>

    <g class="float-node" style="animation-delay: -4s;">
      <rect x="965" y="240" width="95" height="32" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="1" />
      <text x="980" y="260" font-family="sans-serif" font-size="10" font-weight="bold" fill="#67e8f9">IGA Policies</text>
    </g>
  </g>

  <!-- Foreground Header Content (Clear, Legible, Crisp) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <rect x="0" y="55" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="69" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="28" y="73" class="badge-text">ORGANIZATIONAL IAM &amp; IGA ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title-text">
      Team Hierarchy &amp;
    </text>
    <text x="0" y="185" class="title-text" fill="url(#primaryGlow)">
      Permissions Management
    </text>

    <!-- Subtitle & Key Pillars -->
    <text x="0" y="232" class="sub-text">
      Curated architecture guide for Enterprise Org Structures, Role-Based Access Control (RBAC),
    </text>
    <text x="0" y="258" class="sub-text">
      Identity Governance &amp; Administration (IGA), Automated SCIM, and Multi-Tenant Provisioning.
    </text>

    <!-- Metric Tags / Feature Badges -->
    <g transform="translate(0, 288)">
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#e0e7ff">⚡ Multi-Tenant RBAC</text>

      <rect x="145" y="0" width="125" height="26" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1" />
      <text x="156" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#bbf7d0">✓ Zero Trust Ready</text>

      <rect x="280" y="0" width="145" height="26" rx="6" fill="#701a75" stroke="#d946ef" stroke-width="1" />
      <text x="292" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#fdf4ff">🛡️ Identity Governance</text>

      <rect x="435" y="0" width="145" height="26" rx="6" fill="#0f766e" stroke="#14b8a6" stroke-width="1" />
      <text x="447" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#ccfbf1">🔄 Automated SCIM/JML</text>
    </g>
  </g>
</svg>
